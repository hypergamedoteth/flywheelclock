name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launch build
        run: python3 build.py --launch
      - name: Stage public files only
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml CNAME .nojekyll assets companies commodities _site/
          if grep -rIl -e noindex -e "verify before launch" -e "DRAFT PREVIEW" _site; then echo "draft markers found"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
